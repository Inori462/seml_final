<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Account Status | SheRise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { margin: 0; background: #f8f4f7; color: #333; font-family: Arial, sans-serif; }
        main { max-width: 680px; margin: 10vh auto; padding: 28px; background: #fff; border: 1px solid #eadde5; border-radius: 14px; }
    </style>
</head>
<body>
<main>
    <h1>Seller account status</h1>
    <p>Approval: <strong>{{ approval.status|replace('_', ' ')|title }}</strong></p>
    <p>Account: <strong>{{ approval.account_status|title }}</strong></p>
    {% if approval.review_note %}<p>{{ approval.review_note }}</p>{% endif %}
    <p>Seller tools are available after an administrator approves and activates your account.</p>
    <a href="{{ url_for('logout') }}">Log out</a>
</main>
</body>
</html>
